name: Release

# Run by hand on main, releases the version in package.json when it has no tag yet: creates
# the tag v<version> and the GitHub release from the CHANGELOG entry of the version. The
# version and the CHANGELOG are made on develop with Changesets. See "Releases" in
# .github/CONTRIBUTING.md. Nothing is published to npm: the site is the product, and Vercel
# deploys it from main.
#
# The checks of ci.yml ran on the commit when it was pushed to develop, and the ruleset of
# main requires them before the commit can reach main. This workflow does not run them
# again. It reads their results and stops unless each one passed.
on:
  # No `push` trigger: chassis-figma releases nothing yet. The version is 0.1.0, it has no tag
  # and CHANGELOG.md has its entry, so with `push: branches: [main]` here the first push to
  # main would create the tag v0.1.0 and a public GitHub release. A push to main deploys the
  # site and nothing else. The first release is a manual run of this workflow on main, or this
  # trigger put back, when the maintainer decides on it.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be releasing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    # A manual run on another branch stops here
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A version with a prerelease part, such as 0.2.0-next.0, is a prerelease
      - name: Read the version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          {
            echo "version=$VERSION"
            echo "prerelease=$([ "${VERSION#*-}" = "$VERSION" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      - name: Check whether the version has a tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION exists. Nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION does not exist. It will be released."
          fi

  checks:
    name: Checks Passed
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Read the results of CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: |
            Lint
            Type Check
            Site
        run: |
          RESULTS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name')
          MISSING=0

          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue

            if printf '%s\n' "$RESULTS" | grep -qxF "$NAME"; then
              echo "passed: $NAME"
            else
              echo "::error::The check '$NAME' has not passed on $GITHUB_SHA"
              MISSING=1
            fi
          done <<< "$REQUIRED"

          exit $MISSING

  release:
    name: Release
    needs: [detect, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to create the GitHub release and its tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script imports Node.js modules only, so nothing is installed
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Fails when the CHANGELOG has no entry for the version, so such a version is not released
      - name: Release notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: node build/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      # The tag is created with the release, on this commit. A prerelease is marked as one
      # and does not become the latest release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi

          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"
